[package]
name = "sword-fighter-2"
version = "0.1.0"
description = "Sword Fighter 2 desktop wrapper (Tauri)"
authors = ["Andy Budish"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "sword_fighter_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
